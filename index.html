<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ストリートプリント パンフレット構成ツール</title>
<style>
:root{--navy:#0e2742;--navy2:#174273;--blue:#2a6fb5;--blue2:#3f89d0;--green:#4dbe54;--green-d:#2e8f36;--pink:#f5759d;--pink-d:#d0436f;--lime:#7fd585;--ink:#14213a;--sub:#5d6b82;--line:#dfe5ee;--card:#fff;--panel:#f3f6fb;
--warn:#8a4b00;--warn-soft:#fff3dc;--font:'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',Meiryo,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--navy)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{display:grid;grid-template-columns:400px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
/* ── ヘッダー：敷石パターン ── */
.top{grid-column:1/-1;position:relative;overflow:hidden;color:#fff;padding:18px 28px;display:flex;align-items:center;gap:22px;
 background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 55%,var(--blue) 100%)}
.top::before{content:"";position:absolute;inset:0;opacity:.13;
 background-image:linear-gradient(90deg,rgba(255,255,255,.9) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.9) 2px,transparent 2px);
 background-size:56px 28px,56px 28px;background-position:0 0,0 0;
 -webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 75%);mask-image:linear-gradient(100deg,transparent 30%,#000 75%)}
.stripe{position:absolute;right:-40px;top:0;bottom:0;width:300px;background:linear-gradient(100deg,transparent 0 26%,var(--blue2) 26% 30%,transparent 30% 34%,var(--green) 34% 38%,transparent 38% 42%,var(--pink) 42% 46%,transparent 46%)}
.brand{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px}
.brand .wm{font-weight:900;font-size:28px;letter-spacing:.16em;line-height:1}
.brand .wm span{color:var(--lime)}
.brand .dots{display:inline-flex;gap:5px;margin-left:10px;vertical-align:middle}.brand .dots i{width:9px;height:9px;border-radius:50%;display:block}
.brand .sub{font-size:12px;letter-spacing:.2em;opacity:.8}
.hstats{position:relative;z-index:1;margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px);border-radius:999px;padding:7px 14px;font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.chip b{font-size:18px;font-weight:800;color:#fff}.chip em{font-style:normal;opacity:.75}
/* ── サイドバー ── */
.side{background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
.sec{padding:18px 22px;display:flex;flex-direction:column;gap:11px;border-bottom:1px solid var(--line)}
.sec h2{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:0;color:var(--ink);font-weight:800}
.sec h2 .n{width:24px;height:24px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;transform:skewX(-8deg)}
.sec h2 .n i{font-style:normal;transform:skewX(8deg)}
.sec:nth-of-type(3n+2) h2 .n{background:var(--green-d)}.sec:nth-of-type(3n) h2 .n{background:var(--pink-d)}
.sec h2 .cnt{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
.pats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pat{border:2px solid transparent;background:var(--card);border-radius:10px;padding:5px 5px 7px;display:flex;flex-direction:column;gap:5px;align-items:stretch;box-shadow:0 1px 3px rgba(10,29,59,.12);transition:transform .15s,box-shadow .15s}
.pat img{width:100%;aspect-ratio:210/297;object-fit:cover;border-radius:5px;display:block}
.pat span{font-size:11.5px;font-weight:700;text-align:center}
.pat:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(10,29,59,.18)}
.pat[aria-pressed=true]{border-color:var(--blue);box-shadow:0 6px 16px rgba(42,111,181,.35)}
.pat[aria-pressed=true] span{color:var(--blue)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 11px 10px 15px;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.tpl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,#999)}
.tpl b{font-size:12.5px;line-height:1.35}.tpl span{font-size:11px;color:var(--sub);line-height:1.45}
.tpl small{font-size:10.5px;font-weight:700;color:var(--c);letter-spacing:.04em}
.tpl:hover{border-color:var(--c)}
.tpl[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 6px 14px rgba(10,29,59,.12)}
.tpl.wide{grid-column:1/-1;background:linear-gradient(100deg,#fff 55%,#eef6ff 75%,#eefaf0 88%,#fff0f5)}
.tpl.wide::before{background:linear-gradient(var(--blue2) 0 33%,var(--green) 33% 66%,var(--pink) 66%)}
.field{border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--card);min-width:0;width:100%}
.field:focus{border-color:var(--blue);outline:none}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.pitem{display:grid;grid-template-columns:14px 22px 34px 38px minmax(0,1fr) auto;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 7px;transition:box-shadow .12s,transform .12s}
.pitem:hover{box-shadow:0 3px 10px rgba(10,29,59,.1)}
.pitem.drag{opacity:.4}.pitem.over{box-shadow:0 -3px 0 var(--blue)}
.grip{cursor:grab;color:#a8b3c4;font-size:12px;line-height:1;letter-spacing:-2px;user-select:none}
.pitem img{width:34px;height:48px;object-fit:cover;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pitem .no{font-size:11px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.pitem .pid{font-size:11px;font-weight:800;color:#fff;background:var(--blue);border-radius:5px;padding:2px 0;text-align:center}
.pitem .pt{font-size:12px;line-height:1.35}.pitem .pt i{display:block;font-style:normal;font-size:10.5px;color:var(--warn)}
.pitem .ops{display:flex;gap:3px}.pitem .ops button{width:24px;height:24px;border:0;background:var(--panel);border-radius:6px;font-size:12px;padding:0;color:var(--sub)}
.pitem .ops button:hover:not(:disabled){background:var(--blue);color:#fff}
.pitem .ops button[data-op=del]:hover{background:var(--pink-d)}
.pitem .ops button:disabled{opacity:.3;cursor:default}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:9px 14px;font-weight:800}
.btn.ghost{background:var(--card);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn.ghost:hover{background:#ecf4fc}.btn:disabled{opacity:.45;cursor:default}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:#e3e9f2;border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 4px;font-size:12.5px;border-radius:8px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed=true]{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(10,29,59,.15);font-weight:800}
.meta{font-size:12px;color:var(--sub);line-height:1.65}.meta b{color:var(--ink)}
.zoomrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub)}.zoomrow input{flex:1;accent-color:var(--blue)}
.warnbox{background:var(--warn-soft);color:var(--warn);font-size:12px;border-radius:9px;padding:9px 11px;line-height:1.65;border-left:4px solid #f0a020}
.savesec{border-bottom:0;padding-bottom:28px}
.topsave{position:relative;z-index:1;padding:12px 20px;font-size:14.5px}
.savebtn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:15px 16px;font-size:16px;font-weight:900;letter-spacing:.06em;color:#fff;
 background:linear-gradient(100deg,var(--blue) 0%,#2f80c4 55%,var(--green-d) 100%);box-shadow:0 8px 20px rgba(42,111,181,.35);transition:transform .15s,box-shadow .15s}
.savebtn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.savebtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 26px rgba(42,111,181,.45)}
.savebtn:hover:not(:disabled)::after{left:120%}
.savebtn:disabled{opacity:.5;cursor:default}
/* ── プレビュー ── */
.main{overflow:auto;padding:28px 34px 60px;position:relative;
 background-color:#132235;background-image:
 linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
 background-size:48px 24px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.bar .tag{font-size:12px;color:#cfe0ff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:5px 11px;border-radius:999px}
.bar .tag.hl{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.flow{display:flex;flex-wrap:wrap;gap:30px 26px;align-items:flex-start}
.spread{display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .35s both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spread .pair{display:flex;box-shadow:0 14px 30px rgba(0,0,0,.45);position:relative}
.spread .pair::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:18px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.12),transparent);pointer-events:none}
.pg{background:#fff;position:relative;overflow:hidden}
.pg img{display:block;width:100%;height:100%;object-fit:cover}
.pg.blank{background:rgba(255,255,255,.04);outline:1px dashed rgba(255,255,255,.18);outline-offset:-1px}
.single .pg{box-shadow:0 12px 26px rgba(0,0,0,.45);border-radius:2px;transition:transform .18s}
.single:hover .pg{transform:translateY(-4px)}
.cap{font-size:11.5px;color:#9fb2cf;font-variant-numeric:tabular-nums}.cap b{color:#fff;margin-right:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.3);border-left:4px solid var(--pink)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.hstats,.topsave{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="stripe"></div>
  <div class="brand"><div class="wm">STREET<span>PRINT</span><span class="dots" aria-hidden="true"><i style="background:#3f89d0"></i><i style="background:#4dbe54"></i><i style="background:#f5759d"></i></span></div><div class="sub">パンフレット構成ツール</div></div>
  <div class="hstats" id="hstats"></div>
  <button class="savebtn topsave" id="savebtn2">PDFを保存する</button>
</header>
<aside class="side">
  <div class="sec"><h2><span class="n"><i>1</i></span>デザインを選ぶ</h2><div class="pats" id="pat"></div></div>
  <div class="sec"><h2><span class="n"><i>2</i></span>提案先と段階を選ぶ</h2><div class="tpls" id="tpls"></div></div>
  <div class="sec"><h2><span class="n"><i>3</i></span>案件名を入れる</h2><input class="field" type="text" id="case" placeholder="例：○○市 道路課 ご提案"><div class="meta">保存するPDFのファイル名に使います。</div></div>
  <div class="sec">
    <h2><span class="n"><i>4</i></span>ページを整える<span class="cnt" id="cnt"></span></h2>
    <div class="meta">⋮⋮ をつかんでドラッグすると、順番を入れ替えられます。</div>
    <ul class="plist" id="plist"></ul>
    <div class="addrow"><select class="field" id="addsel"></select><button class="btn ghost" id="addbtn">追加</button></div>
    <button class="btn ghost" id="resetbtn">選んだ構成に戻す</button>
  </div>
  <div class="sec">
    <h2><span class="n"><i>5</i></span>見え方を確認する</h2>
    <div class="seg" id="mode"><button data-v="single">1ページずつ</button><button data-v="book">見開き（冊子）</button></div>
    <label class="zoomrow">小 <input type="range" id="zoom" min="0.2" max="0.6" step="0.02"> 大</label>
  </div>
  <div class="sec savesec">
    <h2><span class="n"><i>6</i></span>PDFで保存する</h2>
    <div class="seg" id="out"><button data-v="a4">A4（1枚ずつ）</button><button data-v="a3">A3面付け（中綴じ）</button></div>
    <div class="meta" id="outnote"></div>
    <div class="warnbox" id="warns" hidden></div>
    <button class="savebtn" id="savebtn">PDFを保存する</button>
    <div class="meta">A4は1ページずつ、A3面付けは中綴じ印刷の順に並べたPDFです。印刷会社への入稿には、別途お渡しする高画質データをお使いください。</div>
  </div>
</aside>
<main class="main"><div class="bar" id="bar"></div><div class="flow" id="flow"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,downloads=null;
const st={pat:'P1',tpl:'GOV-A',pages:[],mode:'single',out:'a4',zoom:0.32,caseName:''};
const mod=id=>D.modules.find(m=>m.id===id), tplById=id=>D.templates.find(t=>t.id===id);
const src=id=>'img/'+st.pat+'/'+id+'.jpg';
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function save(){try{localStorage.setItem('sp-tool2',JSON.stringify(st))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('sp-tool2')||'null');if(v)Object.assign(st,v)}catch(e){}}
// 冊子：4の倍数になるよう裏表紙の手前に白紙を入れる
function bookPages(l){const o=l.slice(),pad=(4-o.length%4)%4;if(o.length>=2)o.splice(o.length-1,0,...Array(pad).fill(null));else for(let i=0;i<pad;i++)o.push(null);return o}
// A3中綴じの面付け：8ページなら P8|P1, P2|P7, P6|P3, P4|P5
function impose(n){const s=[];for(let i=0;i<n/2;i++)s.push(i%2===0?[n-1-i,i]:[i,n-1-i]);return s}
function renderSide(){
  $('pat').innerHTML=D.patterns.map(p=>`<button class="pat" data-v="${p.id}" aria-pressed="${p.id===st.pat}"><img src="img/${p.id}/C01.jpg" alt=""><span>${esc(p.name)}</span></button>`).join('');
  const TC={GOV:'#2a6fb5',CON:'#2e8f36',BLD:'#d0436f',ALL:'#2a6fb5'};
  $('tpls').innerHTML=D.templates.map(t=>`<button class="tpl${t.pages.length>16?' wide':''}" style="--c:${TC[t.id.split('-')[0]]||'#2a6fb5'}" data-v="${t.id}" aria-pressed="${t.id===st.tpl}"><small>${t.pages.length}ページ</small><b>${esc(t.name)}</b><span>${esc(t.target)}</span></button>`).join('');
  $('cnt').textContent=st.pages.length+'ページ';
  $('plist').innerHTML=st.pages.map((id,i)=>{const m=mod(id);return `<li class="pitem" draggable="true" data-i="${i}"><span class="grip" aria-hidden="true">⋮⋮</span><span class="no">${i+1}</span><img src="${src(id)}" alt="" loading="lazy"><span class="pid">${id}</span><span class="pt">${esc(m.title)}${m.note?'<i>'+esc(m.note)+'</i>':''}</span><span class="ops"><button data-op="up" data-i="${i}" ${i?'':'disabled'} aria-label="上へ">↑</button><button data-op="down" data-i="${i}" ${i<st.pages.length-1?'':'disabled'} aria-label="下へ">↓</button><button data-op="del" data-i="${i}" aria-label="外す">×</button></span></li>`}).join('');
  const groups={};D.modules.forEach(m=>{(groups[m.group]=groups[m.group]||[]).push(m)});
  $('addsel').innerHTML='<option value="">ページを選んで追加…</option>'+Object.entries(groups).map(([g,ms])=>`<optgroup label="${esc(g)}">`+ms.map(m=>`<option value="${m.id}">${m.id}　${esc(m.title)}${st.pages.includes(m.id)?'（使用中）':''}</option>`).join('')+'</optgroup>').join('');
  [...$('mode').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.mode));
  [...$('out').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.out));
  const bp=bookPages(st.pages);
  $('outnote').textContent=st.out==='a3'?`A3用紙 ${bp.length/4} 枚（表裏${bp.length/2}面）。${bp.length-st.pages.length?'白紙'+(bp.length-st.pages.length)+'ページを裏表紙の手前に入れます。':''}`:`A4 ${st.pages.length} ページ。`;
  const notes=st.pages.map(id=>mod(id)).filter(m=>m.note);
  const dup=st.pages.filter((id,i)=>st.pages.indexOf(id)!==i);
  const w=[];if(notes.length)w.push(`確認中の項目があるページ：${notes.map(m=>m.id).join('、')}`);if(dup.length)w.push(`同じページが2回入っています：${[...new Set(dup)].join('、')}`);
  if(st.pages.includes('C07')&&st.pages.some(x=>['E01','E02','E03'].includes(x)))w.push('C07とE01〜E03は同じ写真を使っています。どちらかを外してください。');
  if(st.pages.includes('X02')&&st.pages.includes('D03'))w.push('X02とD03はどちらもカラー一覧です。どちらかを外してください。');
  if(st.pages.includes('C04')&&st.pages.includes('B02'))w.push('C04とB02は同じ工程写真を使っています。どちらかを外してください。');
  $('warns').hidden=!w.length;$('warns').innerHTML=w.map(esc).join('<br>');
  $('savebtn').disabled=$('savebtn2').disabled=!st.pages.length;$('savebtn').title='';
  $('case').value=st.caseName;$('zoom').value=st.zoom;
}
function pg(id,w){const h=w*297/210;return id?`<div class="pg" style="width:${w}px;height:${h}px"><img src="${src(id)}" alt="${esc(mod(id).title)}" loading="lazy"></div>`:`<div class="pg blank" style="width:${w}px;height:${h}px"></div>`}
function renderMain(){
  const w=Math.round(794*st.zoom);const p=D.patterns.find(x=>x.id===st.pat);
  const tn=tplById(st.tpl)?tplById(st.tpl).name:'カスタム';const bp0=bookPages(st.pages);
  $('bar').innerHTML=`<span class="tag hl">${esc(p.name)}</span><span class="tag">${esc(tn)}</span><span class="tag">${st.mode==='book'?'見開き表示':'1ページずつ表示'}</span>`;
  $('hstats').innerHTML=`<div class="chip"><b>${st.pages.length}</b><em>ページ</em></div><div class="chip"><b>${st.out==='a3'?bp0.length/4:st.pages.length}</b><em>${st.out==='a3'?'枚（A3）':'枚（A4）'}</em></div>`;
  let h='';
  if(st.mode==='single'){h=st.pages.map((id,i)=>`<div class="spread single">${pg(id,w)}<span class="cap"><b>${String(i+1).padStart(2,'0')}</b>${esc(mod(id).title)}</span></div>`).join('')}
  else{const bp=bookPages(st.pages);h+=`<div class="spread"><div class="pair">${pg(null,w)}${pg(bp[0],w)}</div><span class="cap">表紙</span></div>`;
    for(let i=1;i<bp.length-1;i+=2)h+=`<div class="spread"><div class="pair">${pg(bp[i],w)}${pg(bp[i+1],w)}</div><span class="cap">${i+1}–${i+2}</span></div>`;
    h+=`<div class="spread"><div class="pair">${pg(bp[bp.length-1],w)}${pg(null,w)}</div><span class="cap">裏表紙</span></div>`}
  $('flow').innerHTML=h;
}
function update(){renderSide();renderMain();save()}
async function jpg(u){const buf=new Uint8Array(await (await fetch(u)).arrayBuffer());let i=2,w=0,h=0;
  while(i<buf.length){if(buf[i]!==0xFF){i++;continue}const m=buf[i+1],L=(buf[i+2]<<8)|buf[i+3];if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){h=(buf[i+5]<<8)|buf[i+6];w=(buf[i+7]<<8)|buf[i+8];break}i+=2+L}
  return {buf,w,h}}
async function buildPDF(){
  const a3=st.out==='a3',list=a3?bookPages(st.pages):st.pages.slice();
  const PW=595.28,PH=841.89,pages=a3?impose(list.length).map(([l,r])=>[list[l],list[r]]):list.map(id=>[id]);
  const imgs={};for(const id of new Set(list.filter(Boolean)))imgs[id]=await jpg(src(id));
  const enc=new TextEncoder(),parts=[],offs=[];let len=0,n=0;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(body,stream)=>{n++;offs[n]=len;put(`${n} 0 obj\n`);if(stream){put(body);put(stream);put('\nendstream\n')}else put(body);put('endobj\n');return n};
  put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const imgObj={};for(const id in imgs){const im=imgs[id];imgObj[id]=obj(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.buf.length} >>\nstream\n`,im.buf)}
  const pageIds=[],pagesId=n+1+pages.length*2;
  pages.forEach(ids=>{const W=PW*ids.length;let c='',xo='';ids.forEach((id,k)=>{if(id){c+=`q ${PW} 0 0 ${PH} ${(PW*k).toFixed(2)} 0 cm /I${imgObj[id]} Do Q\n`;xo+=`/I${imgObj[id]} ${imgObj[id]} 0 R `}});
    const cs=obj(`<< /Length ${enc.encode(c).length} >>\nstream\n`,enc.encode(c));
    pageIds.push(obj(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W.toFixed(2)} ${PH}] /Resources << /XObject << ${xo}>> >> /Contents ${cs} 0 R >>\n`))});
  obj(`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>\n`);
  const cat=obj(`<< /Type /Catalog /Pages ${pagesId} 0 R >>\n`);
  const xref=len;let x=`xref\n0 ${n+1}\n0000000000 65535 f \n`;for(let i=1;i<=n;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  put(x+`trailer\n<< /Size ${n+1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'})}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function onSave(ev){const b=(ev&&ev.currentTarget)||$('savebtn');b.disabled=true;const o=b.textContent;b.textContent='PDFを作成中…';
  try{const pdf=await buildPDF();const base=(st.caseName||'ストリートプリント').replace(/[\\/:*?"<>|]/g,'').slice(0,60);
    const fn=`${base}_${D.patterns.find(x=>x.id===st.pat).name.replace(/\s/g,'')}_${st.out==='a3'?'A3面付け':'A4'}.pdf`;
    if(downloads)await downloads.save({filename:fn,data:pdf});else dl(pdf,fn);toast('PDFを保存しました')}
  catch(e){const c=e&&e.code;toast(c==='declined'?'保存を取り消しました。':c==='rate_limited'?'少し待ってからもう一度お試しください。':'保存できませんでした。')}
  finally{b.textContent=o;renderSide()}}
function bind(){
  $('pat').onclick=e=>{const b=e.target.closest('button');if(b){st.pat=b.dataset.v;update()}};
  $('tpls').onclick=e=>{const b=e.target.closest('button');if(b){st.tpl=b.dataset.v;st.pages=tplById(st.tpl).pages.slice();update()}};
  $('plist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,p=st.pages;
    if(b.dataset.op==='up')[p[i-1],p[i]]=[p[i],p[i-1]];else if(b.dataset.op==='down')[p[i+1],p[i]]=[p[i],p[i+1]];else p.splice(i,1);update()};
  $('addbtn').onclick=()=>{const v=$('addsel').value;if(!v)return;const p=st.pages;if(p[p.length-1]==='C08')p.splice(p.length-1,0,v);else p.push(v);update();toast(v+' を追加しました。')};
  $('resetbtn').onclick=()=>{const t=tplById(st.tpl);if(t){st.pages=t.pages.slice();update()}};
  $('mode').onclick=e=>{const b=e.target.closest('button');if(b){st.mode=b.dataset.v;update()}};
  $('out').onclick=e=>{const b=e.target.closest('button');if(b){st.out=b.dataset.v;update()}};
  $('zoom').oninput=e=>{st.zoom=+e.target.value;renderMain();save()};
  $('case').oninput=e=>{st.caseName=e.target.value;save()};
  $('savebtn').onclick=onSave;$('savebtn2').onclick=onSave;
  let from=null;const L=$('plist');
  L.addEventListener('dragstart',e=>{const li=e.target.closest('.pitem');if(!li)return;from=+li.dataset.i;li.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(from))}catch(_){}});
  L.addEventListener('dragover',e=>{const li=e.target.closest('.pitem');if(from===null||!li)return;e.preventDefault();[...L.children].forEach(x=>x.classList.toggle('over',x===li))});
  L.addEventListener('dragleave',e=>{if(!L.contains(e.relatedTarget))[...L.children].forEach(x=>x.classList.remove('over'))});
  L.addEventListener('drop',e=>{const li=e.target.closest('.pitem');if(from===null||!li)return;e.preventDefault();const to=+li.dataset.i;const p=st.pages;const [v]=p.splice(from,1);p.splice(to,0,v);from=null;update()});
  L.addEventListener('dragend',()=>{from=null;[...L.children].forEach(x=>x.classList.remove('drag','over'))});
}
fetch('manifest.json').then(r=>r.json()).then(d=>{D=d;load();if(!st.pages||!st.pages.length){st.pages=tplById(st.tpl).pages.slice()}st.pages=st.pages.filter(id=>mod(id));bind();update()})
.catch(()=>{$('flow').textContent='ページデータを読み込めませんでした。再読み込みしてください。'});
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{downloads=d;if(D)renderSide()}).catch(()=>{})}catch(e){}
})();
</script>
